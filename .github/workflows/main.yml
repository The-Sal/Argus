name: Manual CI/CD Trigger

on:
  workflow_dispatch:
    inputs:
      commit_url:
        description: 'Commit URL to process (leave empty for latest)'
        required: false
        type: string

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit URL
        id: commit
        run: |
          if [ -z "${{ github.event.inputs.commit_url }}" ]; then
            COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          else
            COMMIT_URL="${{ github.event.inputs.commit_url }}"
          fi
          echo "url=$COMMIT_URL" >> $GITHUB_OUTPUT
          echo "Using commit URL: $COMMIT_URL"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger CI/CD Pipeline (Long Webhook)
        run: |
          echo "=========================================="
          echo "🚀 Triggering CI/CD pipeline via long-webhook..."
          echo "=========================================="
          echo "Endpoint: https://sals-macbook-pro.tail34e8af.ts.net/long-webhook"
          echo "Commit URL: ${{ steps.commit.outputs.url }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "=========================================="
          echo ""

          COMMIT_URL="${{ steps.commit.outputs.url }}"
          ENDPOINT="https://sals-macbook-pro.tail34e8af.ts.net/long-webhook"

          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 📤 Sending request to long-webhook endpoint..."

          # Use --max-time 0 to disable timeout (will use job timeout-minutes instead)
          RESPONSE=$(curl \
            --max-time 0 \
            -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -w "\n\n=== CURL METADATA ===\nHTTP Status: %{http_code}\nTotal Time: %{time_total}s\nConnect Time: %{time_connect}s\n" \
            -d "{
              \"head_commit\": {
                \"url\": \"$COMMIT_URL\"
              },
              \"repository\": {
                \"full_name\": \"${{ github.repository }}\"
              },
              \"ref\": \"${{ github.ref }}\"
            }" 2>&1)

          CURL_EXIT=$?

          echo "[$(date +'%Y-%m-%d %H:%M:%S')] 📨 Response received"
          echo ""
          echo "=========================================="
          echo "Pipeline Result:"
          echo "=========================================="
          echo "$RESPONSE"
          echo "=========================================="
          echo ""

          # Check if curl succeeded
          if [ $CURL_EXIT -eq 0 ]; then
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ✅ Request completed successfully"

            # Separate body and the curl metadata that we appended with -w
            BODY=$(printf '%s\n' "$RESPONSE" | awk '/^=== CURL METADATA ===/{exit} {print}')
            METADATA=$(printf '%s\n' "$RESPONSE" | awk '/^=== CURL METADATA ===/{flag=1; next} flag{print}')

            # Extract HTTP status from metadata (if present)
            HTTP_STATUS=$(printf '%s\n' "$METADATA" | grep "HTTP Status:" | awk '{print $3}')

            # Parse pipeline status using jq with fallback for nested structures
            # .status or .pipeline.status are common shapes; jq -r returns "null" if not present so we coerce to empty string
            PIPELINE_STATUS=$(printf '%s\n' "$BODY" | jq -r '.status // .pipeline.status // ""' 2>/dev/null || true)

            echo "[$(date +'%Y-%m-%d %H:%M:%S')] HTTP Status Code: ${HTTP_STATUS:-<none>}"
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] Pipeline Status: ${PIPELINE_STATUS:-<none>}"

            # Determine final exit code based on pipeline status
            if [ "$PIPELINE_STATUS" = "passed" ]; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] 🎉 Pipeline PASSED!"
              exit 0
            elif [ "$PIPELINE_STATUS" = "failed" ]; then
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ❌ Pipeline FAILED!"
              exit 1
            else
              echo "[$(date +'%Y-%m-%d %H:%M:%S')] ⚠️  Unknown pipeline status: $PIPELINE_STATUS"
              # If HTTP returned non-2xx treat as failure, otherwise treat as unknown and fail so it gets attention
              if [ -n "$HTTP_STATUS" ] && [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
                echo "[$(date +'%Y-%m-%d %H:%M:%S')] HTTP 2xx but no status field in response body. Failing for safety."
                exit 1
              else
                exit 1
              fi
            fi
          else
            echo "[$(date +'%Y-%m-%d %H:%M:%S')] ❌ Curl request failed with exit code: $CURL_EXIT"
            exit $CURL_EXIT
          fi
